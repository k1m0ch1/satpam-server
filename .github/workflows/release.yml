name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist

          targets=(
            "linux   amd64  satpam-server-linux-amd64"
            "linux   arm64  satpam-server-linux-arm64"
            "windows amd64  satpam-server-windows-amd64.exe"
            "darwin  amd64  satpam-server-darwin-amd64"
            "darwin  arm64  satpam-server-darwin-arm64"
          )

          for row in "${targets[@]}"; do
            read -r os arch out <<< "$row"
            echo "Building $out..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/$out .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/satpam-server-linux-amd64
            dist/satpam-server-linux-arm64
            dist/satpam-server-windows-amd64.exe
            dist/satpam-server-darwin-amd64
            dist/satpam-server-darwin-arm64

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/k1m0ch1/satpam-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
